<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trimble Property Set Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 16px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            margin-top: 15px;
            padding: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Property Set Test</h2>

    <p>
        Test the Trimble Property Set Service
        against the selected weld object.
    </p>

    <button id="testButton">
        FIND WELD PROPERTY SETS
    </button>

    <pre id="result">Waiting...</pre>

</div>


<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>

<script>

let API = null;


// --------------------------------------------------
// START
// --------------------------------------------------

async function start() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Connecting to Trimble Connect...";

        API =
            await TrimbleConnectWorkspace.connect(
                window.parent
            );

        result.textContent =
            "Connected.\n\n" +
            "Click FIND WELD PROPERTY SETS.";

    } catch (error) {

        showFailure(
            "Connection failed",
            error
        );
    }
}


// --------------------------------------------------
// RUN TEST
// --------------------------------------------------

async function runTest() {

    const result =
        document.getElementById("result");

    try {

        // ------------------------------------------
        // GET PROJECT
        // ------------------------------------------

        result.textContent =
            "Getting current project...";

        const project =
            await API.project.getProject();

        const projectId =
            project.id;

        const projectLocation =
            String(
                project.location || ""
            ).toLowerCase();


        // ------------------------------------------
        // GET ACCESS TOKEN
        // ------------------------------------------

        result.textContent =
            "Project received.\n\n" +
            "Requesting access permission...";

        const token =
            await API.extension.requestPermission(
                "accesstoken"
            );

        if (!token) {

            throw new Error(
                "No access token was returned."
            );
        }


        // ------------------------------------------
        // DISCOVER REGIONS
        // ------------------------------------------

        result.textContent =
            "Project received.\n" +
            "Access permission received.\n\n" +
            "Discovering regional services...";

        const regionsResponse =
            await fetch(
                "https://app.connect.trimble.com/tc/api/2.0/regions",
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        if (!regionsResponse.ok) {

            throw new Error(
                "Regions API returned HTTP " +
                regionsResponse.status
            );
        }

        const regions =
            await regionsResponse.json();


        // ------------------------------------------
        // FIND EUROPE REGION
        // ------------------------------------------

        const europeRegion =
            findEuropeRegion(
                regions,
                projectLocation
            );

        if (!europeRegion) {

            throw new Error(
                "Could not find the Europe region."
            );
        }


        // ------------------------------------------
        // FIND PROPERTY SET API
        // ------------------------------------------

        const psetApi =
            europeRegion["pset-api"] ||
            europeRegion.psetApi ||
            europeRegion.services?.["pset-api"] ||
            europeRegion.services?.psetApi;

        if (!psetApi) {

            result.textContent =
                "PROJECT\n" +
                "--------------------\n" +
                safeJson(project) +
                "\n\n" +

                "EUROPE REGION FOUND\n" +
                "--------------------\n" +
                safeJson(europeRegion) +
                "\n\n" +

                "ERROR\n" +
                "--------------------\n" +
                "No pset-api field was found.";

            return;
        }


        // ------------------------------------------
        // BUILD BASE URL
        // ------------------------------------------

        const baseUrl =
            String(psetApi).endsWith("/")
                ? String(psetApi)
                : String(psetApi) + "/";


        // ------------------------------------------
        // WELD WE ARE TESTING
        // ------------------------------------------

        const weldGuid =
            "f83962c4-3acc-4606-9a48-f17d3a4a2998";

        const weldLink =
            "frn:entity:" + weldGuid;


        // ------------------------------------------
        // BUILD PSET REQUEST
        // ------------------------------------------

        const psetsUrl =
            baseUrl +
            "psets/" +
            encodeURIComponent(weldLink);


        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            "ID: " + projectId + "\n" +
            "Location: " + projectLocation + "\n\n" +

            "PROPERTY SET API\n" +
            "--------------------\n" +
            baseUrl + "\n\n" +

            "WELD GUID\n" +
            "--------------------\n" +
            weldGuid + "\n\n" +

            "WELD LINK\n" +
            "--------------------\n" +
            weldLink + "\n\n" +

            "PSET REQUEST\n" +
            "--------------------\n" +
            psetsUrl + "\n\n" +

            "Requesting attached property sets...";


        // ------------------------------------------
        // CALL PROPERTY SET API
        // ------------------------------------------

        const psetsResponse =
            await fetch(
                psetsUrl,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        // ------------------------------------------
        // READ RESPONSE
        // ------------------------------------------

        const psetsText =
            await psetsResponse.text();

        let psetsData;

        try {

            psetsData =
                JSON.parse(
                    psetsText
                );

        } catch {

            psetsData =
                psetsText;
        }


        // ------------------------------------------
        // DISPLAY RESULT
        // ------------------------------------------

        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            "ID: " + projectId + "\n" +
            "Location: " + projectLocation + "\n\n" +

            "PROPERTY SET API\n" +
            "--------------------\n" +
            baseUrl + "\n\n" +

            "WELD GUID\n" +
            "--------------------\n" +
            weldGuid + "\n\n" +

            "WELD LINK\n" +
            "--------------------\n" +
            weldLink + "\n\n" +

            "PSET REQUEST\n" +
            "--------------------\n" +
            psetsUrl + "\n\n" +

            "HTTP STATUS\n" +
            "--------------------\n" +
            psetsResponse.status + "\n\n" +

            "RESPONSE\n" +
            "--------------------\n" +
            safeJson(
                psetsData
            );


    } catch (error) {

        showFailure(
            "Property Set test failed",
            error
        );
    }
}


// --------------------------------------------------
// FIND EUROPE REGION
// --------------------------------------------------

function findEuropeRegion(
    regions,
    projectLocation
) {

    if (!Array.isArray(regions)) {
        return null;
    }


    const exact =
        regions.find(region => {

            const values =
                [
                    region.location,
                    region.name,
                    region.trmRegion,
                    region.region,
                    region.awsRegion
                ]
                .filter(Boolean)
                .map(value =>
                    String(value)
                        .toLowerCase()
                );


            return values.some(value =>
                value === projectLocation ||
                value === "europe" ||
                value === "eu" ||
                value.includes("europe")
            );
        });


    if (exact) {
        return exact;
    }


    return regions.find(region => {

        const text =
            safeJson(region)
                .toLowerCase();


        return (
            text.includes("europe") ||
            text.includes("\"eu\"") ||
            text.includes("app21")
        );
    });
}


// --------------------------------------------------
// SAFE JSON
// --------------------------------------------------

function safeJson(value) {

    try {

        return JSON.stringify(
            value,
            (key, item) =>
                typeof item === "bigint"
                    ? item.toString()
                    : item,
            2
        );

    } catch {

        return String(value);
    }
}


// --------------------------------------------------
// DISPLAY ERROR
// --------------------------------------------------

function showFailure(
    title,
    error
) {

    console.error(error);

    document
        .getElementById("result")
        .textContent =

        title +
        "\n" +
        "--------------------\n\n" +

        (
            error &&
            error.message
                ? error.message
                : String(error)
        );
}


// --------------------------------------------------
// BUTTON
// --------------------------------------------------

document
    .getElementById("testButton")
    .addEventListener(
        "click",
        runTest
    );


// --------------------------------------------------
// GO
// --------------------------------------------------

window.addEventListener(
    "load",
    start
);

</script>

</body>

</html>
