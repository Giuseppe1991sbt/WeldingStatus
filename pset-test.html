<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trimble Shared Weld Status Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 16px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #888888;
            cursor: wait;
        }

        pre {
            margin-top: 15px;
            padding: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            max-height: 520px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Shared Weld Status Test</h2>

    <p>
        Create a Trimble cloud Property Set and write a shared
        status against the test weld.
    </p>

    <button id="testButton">
        CREATE AND WRITE SHARED STATUS
    </button>

    <pre id="result">Waiting...</pre>

</div>


<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>

<script>

let API = null;


// --------------------------------------------------
// FIXED SHARED RESOURCE IDENTIFIERS
// --------------------------------------------------

const LIBRARY_ID =
    "welding-status-shared-v1";

const DEFINITION_ID =
    "weld-status-tracker-v1";

const WELD_GUID =
    "f83962c4-3acc-4606-9a48-f17d3a4a2998";

const WELD_LINK =
    "frn:entity:" + WELD_GUID;


// --------------------------------------------------
// START
// --------------------------------------------------

async function start() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Connecting to Trimble Connect...";

        API =
            await TrimbleConnectWorkspace.connect(
                window.parent
            );

        const project =
            await API.project.getProject();

        result.textContent =
            "Connected to Trimble Connect.\n\n" +
            "Project: " +
            (
                project?.name ||
                project?.id ||
                "Unknown"
            ) +
            "\n\n" +
            "Click CREATE AND WRITE SHARED STATUS.";

    } catch (error) {

        showFailure(
            "Connection failed",
            error
        );
    }
}


// --------------------------------------------------
// MAIN CLOUD TEST
// --------------------------------------------------

async function runTest() {

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("testButton");

    button.disabled = true;

    try {

        // ------------------------------------------
        // PROJECT
        // ------------------------------------------

        showStep(
            "Getting current Trimble project..."
        );

        const project =
            await API.project.getProject();

        const projectId =
            project.id;

        const projectLocation =
            String(
                project.location || ""
            ).toLowerCase();


        // ------------------------------------------
        // ACCESS TOKEN
        // ------------------------------------------

        showStep(
            "Requesting Trimble access token..."
        );

        const token =
            await API.extension.requestPermission(
                "accesstoken"
            );

        if (!token) {

            throw new Error(
                "Trimble Connect did not return an access token."
            );
        }


        // ------------------------------------------
        // REGIONAL SERVICES
        // ------------------------------------------

        showStep(
            "Finding the European Trimble services..."
        );

        const regionsResponse =
            await fetch(
                "https://app.connect.trimble.com/tc/api/2.0/regions",
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        if (!regionsResponse.ok) {

            throw new Error(
                "Regions API returned HTTP " +
                regionsResponse.status
            );
        }

        const regions =
            await regionsResponse.json();

        const europeRegion =
            findEuropeRegion(
                regions,
                projectLocation
            );

        if (!europeRegion) {

            throw new Error(
                "Could not find the Europe region."
            );
        }


        // ------------------------------------------
        // PROPERTY SET API
        // ------------------------------------------

        const psetApi =
            europeRegion["pset-api"] ||
            europeRegion.psetApi ||
            europeRegion.services?.["pset-api"] ||
            europeRegion.services?.psetApi;

        if (!psetApi) {

            throw new Error(
                "The Europe region did not return a pset-api URL."
            );
        }

        const baseUrl =
            String(psetApi).endsWith("/")
                ? String(psetApi)
                : String(psetApi) + "/";

        const headers = {
            "Accept":
                "application/json",

            "Content-Type":
                "application/json",

            "Authorization":
                "Bearer " + token
        };


        // ------------------------------------------
        // 1. CREATE OR VERIFY LIBRARY
        // ------------------------------------------

        showStep(
            "Creating shared WeldingStatus library..."
        );

        const libraryUrl =
            baseUrl +
            "libs/" +
            encodeURIComponent(LIBRARY_ID);

        let libraryExists =
            await resourceExists(
                libraryUrl,
                token
            );

        if (!libraryExists) {

            const createLibraryResponse =
                await fetch(
                    baseUrl + "libs",
                    {
                        method: "POST",

                        headers:
                            headers,

                        body:
                            JSON.stringify(
                                {
                                    libId:
                                        LIBRARY_ID,

                                    name:
                                        "WeldingStatus Shared Library"
                                }
                            )
                    }
                );

            if (
                !createLibraryResponse.ok &&
                createLibraryResponse.status !== 409
            ) {

                throw await createApiError(
                    "Create library",
                    createLibraryResponse
                );
            }

            libraryExists =
                true;
        }


        // ------------------------------------------
        // 2. CREATE OR VERIFY DEFINITION
        // ------------------------------------------

        showStep(
            "Creating Weld Status Tracker definition..."
        );

        const definitionUrl =
            baseUrl +
            "libs/" +
            encodeURIComponent(LIBRARY_ID) +
            "/defs/" +
            encodeURIComponent(DEFINITION_ID);

        let definitionExists =
            await resourceExists(
                definitionUrl,
                token
            );

        if (!definitionExists) {

            const createDefinitionResponse =
                await fetch(
                    baseUrl +
                    "libs/" +
                    encodeURIComponent(LIBRARY_ID) +
                    "/defs",
                    {
                        method: "POST",

                        headers:
                            headers,

                        body:
                            JSON.stringify(
                                {
                                    defId:
                                        DEFINITION_ID,

                                    name:
                                        "Weld Status Tracker",

                                    types: [
                                        "BEAM"
                                    ],

                                    schema: {
                                        props: {
                                            status: {
                                                type:
                                                    "string"
                                            },

                                            comment: {
                                                type:
                                                    "string"
                                            },

                                            updatedAt: {
                                                type:
                                                    "string"
                                            },

                                            updatedBy: {
                                                type:
                                                    "string"
                                            }
                                        }
                                    }
                                }
                            )
                    }
                );

            if (
                !createDefinitionResponse.ok &&
                createDefinitionResponse.status !== 409
            ) {

                throw await createApiError(
                    "Create definition",
                    createDefinitionResponse
                );
            }

            definitionExists =
                true;
        }


        // ------------------------------------------
        // 3. WRITE SHARED PSET
        // ------------------------------------------

        showStep(
            "Writing Part Completed to the Trimble cloud..."
        );

        const psetUrl =
            baseUrl +
            "psets/" +
            encodeURIComponent(WELD_LINK) +
            "/" +
            encodeURIComponent(LIBRARY_ID) +
            "/" +
            encodeURIComponent(DEFINITION_ID);

        const writeTime =
            new Date().toISOString();

        const writeResponse =
            await fetch(
                psetUrl,
                {
                    method: "PATCH",

                    headers:
                        headers,

                    body:
                        JSON.stringify(
                            {
                                props: {
                                    status:
                                        "Part Completed",

                                    comment:
                                        "SYNC TEST",

                                    updatedAt:
                                        writeTime,

                                    updatedBy:
                                        "Weld Status Tracker"
                                }
                            }
                        )
                }
            );

        if (!writeResponse.ok) {

            throw await createApiError(
                "Write shared weld status",
                writeResponse
            );
        }


        // ------------------------------------------
        // ALLOW EVENTUAL CONSISTENCY
        // ------------------------------------------

        showStep(
            "Write accepted. Waiting for cloud synchronisation..."
        );

        await wait(
            1500
        );


        // ------------------------------------------
        // 4. READ THE PSET BACK
        // ------------------------------------------

        showStep(
            "Reading the shared value back..."
        );

        const readResponse =
            await fetch(
                psetUrl,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const readText =
            await readResponse.text();

        let readData;

        try {

            readData =
                JSON.parse(
                    readText
                );

        } catch {

            readData =
                readText;
        }

        if (!readResponse.ok) {

            throw new Error(
                "Read-back returned HTTP " +
                readResponse.status +
                "\n\n" +
                safeJson(readData)
            );
        }


        // ------------------------------------------
        // SUCCESS
        // ------------------------------------------

        result.textContent =
            "SHARED CLOUD WRITE SUCCESSFUL\n" +
            "================================\n\n" +

            "PROJECT\n" +
            "--------------------\n" +
            "Name: " +
            (
                project.name ||
                "Not returned"
            ) +
            "\n" +
            "ID: " +
            projectId +
            "\n" +
            "Location: " +
            projectLocation +
            "\n\n" +

            "PROPERTY SET API\n" +
            "--------------------\n" +
            baseUrl +
            "\n\n" +

            "LIBRARY\n" +
            "--------------------\n" +
            LIBRARY_ID +
            "\n\n" +

            "DEFINITION\n" +
            "--------------------\n" +
            DEFINITION_ID +
            "\n\n" +

            "WELD LINK\n" +
            "--------------------\n" +
            WELD_LINK +
            "\n\n" +

            "WRITE STATUS\n" +
            "--------------------\n" +
            writeResponse.status +
            "\n\n" +

            "READ STATUS\n" +
            "--------------------\n" +
            readResponse.status +
            "\n\n" +

            "SHARED DATA\n" +
            "--------------------\n" +
            safeJson(
                readData
            );

    } catch (error) {

        showFailure(
            "Shared cloud write failed",
            error
        );

    } finally {

        button.disabled =
            false;
    }
}


// --------------------------------------------------
// CHECK IF RESOURCE EXISTS
// --------------------------------------------------

async function resourceExists(
    url,
    token
) {

    const response =
        await fetch(
            url,
            {
                method: "GET",

                headers: {
                    "Accept":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                }
            }
        );

    if (response.ok) {
        return true;
    }

    if (response.status === 404) {
        return false;
    }

    throw await createApiError(
        "Check resource",
        response
    );
}


// --------------------------------------------------
// CREATE READABLE API ERROR
// --------------------------------------------------

async function createApiError(
    operation,
    response
) {

    const responseText =
        await response.text();

    let responseData;

    try {

        responseData =
            JSON.parse(
                responseText
            );

    } catch {

        responseData =
            responseText;
    }

    return new Error(
        operation +
        " returned HTTP " +
        response.status +
        "\n\n" +
        safeJson(
            responseData
        )
    );
}


// --------------------------------------------------
// FIND EUROPE REGION
// --------------------------------------------------

function findEuropeRegion(
    regions,
    projectLocation
) {

    if (!Array.isArray(regions)) {
        return null;
    }

    const exact =
        regions.find(region => {

            const values =
                [
                    region.location,
                    region.name,
                    region.trmRegion,
                    region.region,
                    region.awsRegion
                ]
                .filter(Boolean)
                .map(value =>
                    String(value)
                        .toLowerCase()
                );

            return values.some(value =>
                value === projectLocation ||
                value === "europe" ||
                value === "eu" ||
                value.includes("europe")
            );
        });

    if (exact) {
        return exact;
    }

    return regions.find(region => {

        const text =
            safeJson(region)
                .toLowerCase();

        return (
            text.includes("europe") ||
            text.includes("\"eu\"") ||
            text.includes("app21")
        );
    });
}


// --------------------------------------------------
// SHOW CURRENT STEP
// --------------------------------------------------

function showStep(message) {

    document
        .getElementById("result")
        .textContent =
        message;
}


// --------------------------------------------------
// WAIT
// --------------------------------------------------

function wait(milliseconds) {

    return new Promise(resolve => {

        setTimeout(
            resolve,
            milliseconds
        );
    });
}


// --------------------------------------------------
// SAFE JSON
// --------------------------------------------------

function safeJson(value) {

    try {

        return JSON.stringify(
            value,
            (key, item) =>
                typeof item === "bigint"
                    ? item.toString()
                    : item,
            2
        );

    } catch {

        return String(value);
    }
}


// --------------------------------------------------
// SHOW FAILURE
// --------------------------------------------------

function showFailure(
    title,
    error
) {

    console.error(error);

    document
        .getElementById("result")
        .textContent =

        title +
        "\n" +
        "================================\n\n" +

        (
            error?.message ||
            String(error)
        );
}


// --------------------------------------------------
// BUTTON
// --------------------------------------------------

document
    .getElementById("testButton")
    .addEventListener(
        "click",
        runTest
    );


// --------------------------------------------------
// GO
// --------------------------------------------------

window.addEventListener(
    "load",
    start
);

</script>

</body>

</html>
