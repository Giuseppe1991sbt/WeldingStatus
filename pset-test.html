<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Property Set Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 6px;
        }

        button {
            padding: 10px 16px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        pre {
            margin-top: 16px;
            padding: 12px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Trimble Property Set Test</h2>

        <p>
            This page checks whether the extension can retrieve
            Property Set libraries.
        </p>

        <button id="testButton">
            TEST PROPERTY SET ACCESS
        </button>

        <pre id="result">
Waiting...
        </pre>

    </div>


    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>


    <script>

        let API = null;


        async function initialise() {

            const result =
                document.getElementById("result");


            try {

                result.textContent =
                    "Connecting to Trimble Connect...";


                API =
                    await TrimbleConnectWorkspace.connect(
                        window.parent
                    );


                result.textContent =
                    "Connected.\n\n" +
                    "Click TEST PROPERTY SET ACCESS.";


            } catch (error) {

                result.textContent =
                    "Connection error:\n\n" +
                    error.message;
            }
        }


        async function testPropertySets() {

            const result =
                document.getElementById("result");


            try {

                result.textContent =
                    "Requesting permission...";


                const token =
                    await API.extension.requestPermission(
                        "accesstoken"
                    );


                if (!token) {

                    throw new Error(
                        "No access token was returned."
                    );
                }


                result.textContent =
                    "Permission granted.\n\n" +
                    "Loading Property Set libraries...";


                const response =
                    await fetch(
                        "https://pset-api.connect.trimble.com/v1/libs",
                        {
                            method: "GET",

                            headers: {
                                "Accept": "application/json",

                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const responseText =
                    await response.text();


                let responseData;


                try {

                    responseData =
                        JSON.parse(responseText);

                } catch {

                    responseData =
                        responseText;
                }


                result.textContent =
                    "HTTP status: " +
                    response.status +
                    "\n\n" +

                    JSON.stringify(
                        responseData,
                        null,
                        2
                    );


            } catch (error) {

                console.error(error);


                result.textContent =
                    "Property Set test failed:\n\n" +
                    error.message;
            }
        }


        document
            .getElementById("testButton")
            .addEventListener(
                "click",
                testPropertySets
            );


        window.addEventListener(
            "load",
            initialise
        );

    </script>

</body>

</html>
