<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shared Weld Status Write Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 16px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #888888;
            cursor: wait;
        }

        pre {
            margin-top: 15px;
            padding: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            max-height: 520px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Shared Weld Status Write</h2>

    <p>
        Write Part Completed into the real Weld Progress
        Property Set stored in Trimble.
    </p>

    <button id="writeButton" disabled>
        WRITE PART COMPLETED
    </button>

    <pre id="result">Loading JavaScript...</pre>

</div>


<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>

<script>

let API = null;


// --------------------------------------------------
// REAL TRIMBLE RESOURCE IDENTIFIERS
// --------------------------------------------------

const LIBRARY_ID =
    "7r7dk7c43t1shjqgmj5urdjbyrtsssh0";

const DEFINITION_ID =
    "uvq7wy0xgyb2o2sxornh5juwyngsn76w";

const WELD_STATUS_PROPERTY_ID =
    "prop_k57dohz4v8wj0sploxwvjt8jhn7jn605";

const WELD_GUID =
    "f83962c4-3acc-4606-9a48-f17d3a4a2998";

const WELD_LINK =
    "frn:entity:" + WELD_GUID;


// --------------------------------------------------
// START
// --------------------------------------------------

async function start() {

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("writeButton");

    try {

        result.textContent =
            "Connecting to Trimble Connect...";

        API =
            await TrimbleConnectWorkspace.connect(
                window.parent
            );

        const project =
            await API.project.getProject();

        result.textContent =
            "CONNECTED\n" +
            "================================\n\n" +
            "Project:\n" +
            (
                project &&
                (project.name || project.id)
                    ? (project.name || project.id)
                    : "Not returned"
            ) +
            "\n\n" +
            "Test weld GUID:\n" +
            WELD_GUID +
            "\n\n" +
            "Ready to perform the shared write.";

        button.disabled = false;

    } catch (error) {

        showFailure(
            "Connection failed",
            error
        );
    }
}


// --------------------------------------------------
// WRITE SHARED STATUS
// --------------------------------------------------

async function writeSharedStatus() {

    const button =
        document.getElementById("writeButton");

    button.disabled = true;

    try {

        // ------------------------------------------
        // PROJECT
        // ------------------------------------------

        showStep(
            "Getting project information..."
        );

        const project =
            await API.project.getProject();

        const projectLocation =
            String(
                project && project.location
                    ? project.location
                    : ""
            ).toLowerCase();


        // ------------------------------------------
        // ACCESS TOKEN
        // ------------------------------------------

        showStep(
            "Getting Trimble access token..."
        );

        const token =
            await API.extension.requestPermission(
                "accesstoken"
            );

        if (!token) {

            throw new Error(
                "Trimble Connect did not return an access token."
            );
        }


        // ------------------------------------------
        // REGIONS
        // ------------------------------------------

        showStep(
            "Finding the regional Property Set service..."
        );

        const regionsResponse =
            await fetch(
                "https://app.connect.trimble.com/tc/api/2.0/regions",
                {
                    method: "GET",

                    headers: {
                        "Accept": "application/json",
                        "Authorization": "Bearer " + token
                    }
                }
            );

        if (!regionsResponse.ok) {

            throw await createApiError(
                "Regions request",
                regionsResponse
            );
        }

        const regions =
            await regionsResponse.json();


        // ------------------------------------------
        // EUROPE REGION
        // ------------------------------------------

        const europeRegion =
            findEuropeRegion(
                regions,
                projectLocation
            );

        if (!europeRegion) {

            throw new Error(
                "Could not identify the Trimble Europe region."
            );
        }


        // ------------------------------------------
        // PROPERTY SET API
        // ------------------------------------------

        const psetApi =
            europeRegion["pset-api"] ||
            europeRegion.psetApi ||
            (
                europeRegion.services
                    ? europeRegion.services["pset-api"]
                    : null
            ) ||
            (
                europeRegion.services
                    ? europeRegion.services.psetApi
                    : null
            );

        if (!psetApi) {

            throw new Error(
                "The Europe region did not return a Property Set API URL."
            );
        }


        const baseUrl =
            String(psetApi).endsWith("/")
                ? String(psetApi)
                : String(psetApi) + "/";


        // ------------------------------------------
        // BUILD REAL PROPERTY SET URL
        // ------------------------------------------

        const psetUrl =
            baseUrl +
            "psets/" +
            encodeURIComponent(WELD_LINK) +
            "/" +
            encodeURIComponent(LIBRARY_ID) +
            "/" +
            encodeURIComponent(DEFINITION_ID);


        // ------------------------------------------
        // WRITE PAYLOAD
        // ------------------------------------------

        const writeBody = {
            props: {}
        };

        writeBody.props[WELD_STATUS_PROPERTY_ID] =
            "Part Completed";


        // ------------------------------------------
        // SHOW EXACT REQUEST
        // ------------------------------------------

        showStep(
            "WRITING TO TRIMBLE CLOUD\n" +
            "================================\n\n" +

            "Weld:\n" +
            WELD_GUID +
            "\n\n" +

            "New Weld Status:\n" +
            "Part Completed\n\n" +

            "Endpoint:\n" +
            psetUrl +
            "\n\n" +

            "Payload:\n" +
            safeJson(writeBody) +
            "\n\n" +

            "Sending PATCH request..."
        );


        // ------------------------------------------
        // PATCH
        // ------------------------------------------

        const writeResponse =
            await fetch(
                psetUrl,
                {
                    method: "PATCH",

                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                    body:
                        JSON.stringify(
                            writeBody
                        )
                }
            );


        const writeData =
            await readResponseData(
                writeResponse
            );


        if (!writeResponse.ok) {

            throw new Error(
                "PATCH returned HTTP " +
                writeResponse.status +
                "\n\n" +
                safeJson(writeData)
            );
        }


        // ------------------------------------------
        // WAIT FOR CLOUD READ-BACK
        // ------------------------------------------

        showStep(
            "PATCH accepted with HTTP " +
            writeResponse.status +
            ".\n\n" +
            "Waiting for Trimble cloud read-back..."
        );


        await wait(1500);


        // ------------------------------------------
        // GET SAME PROPERTY SET BACK
        // ------------------------------------------

        const readResponse =
            await fetch(
                psetUrl,
                {
                    method: "GET",

                    headers: {
                        "Accept": "application/json",
                        "Authorization": "Bearer " + token
                    }
                }
            );


        const readData =
            await readResponseData(
                readResponse
            );


        if (!readResponse.ok) {

            throw new Error(
                "PATCH was accepted, but GET returned HTTP " +
                readResponse.status +
                "\n\n" +
                safeJson(readData)
            );
        }


        // ------------------------------------------
        // SUCCESS
        // ------------------------------------------

        showStep(
            "SHARED WRITE SUCCESSFUL\n" +
            "================================\n\n" +

            "Project:\n" +
            (
                project &&
                (project.name || project.id)
                    ? (project.name || project.id)
                    : "Not returned"
            ) +
            "\n\n" +

            "Library:\n" +
            "Weld Status Tracking\n" +
            LIBRARY_ID +
            "\n\n" +

            "Definition:\n" +
            "Weld Progress\n" +
            DEFINITION_ID +
            "\n\n" +

            "Weld link:\n" +
            WELD_LINK +
            "\n\n" +

            "Written value:\n" +
            "Part Completed\n\n" +

            "PATCH HTTP status:\n" +
            writeResponse.status +
            "\n\n" +

            "GET HTTP status:\n" +
            readResponse.status +
            "\n\n" +

            "TRIMBLE CLOUD RESPONSE\n" +
            "--------------------\n" +
            safeJson(readData)
        );


    } catch (error) {

        showFailure(
            "Shared weld status write failed",
            error
        );

    } finally {

        button.disabled = false;
    }
}


// --------------------------------------------------
// READ RESPONSE
// --------------------------------------------------

async function readResponseData(response) {

    const text =
        await response.text();

    if (!text) {
        return {};
    }

    try {

        return JSON.parse(text);

    } catch (error) {

        return text;
    }
}


// --------------------------------------------------
// API ERROR
// --------------------------------------------------

async function createApiError(
    operation,
    response
) {

    const data =
        await readResponseData(
            response
        );

    return new Error(
        operation +
        " returned HTTP " +
        response.status +
        "\n\n" +
        safeJson(data)
    );
}


// --------------------------------------------------
// FIND EUROPE REGION
// --------------------------------------------------

function findEuropeRegion(
    regions,
    projectLocation
) {

    if (!Array.isArray(regions)) {
        return null;
    }


    const exact =
        regions.find(function(region) {

            const values =
                [
                    region.location,
                    region.name,
                    region.trmRegion,
                    region.region,
                    region.awsRegion
                ]
                .filter(Boolean)
                .map(function(value) {

                    return String(value)
                        .toLowerCase();
                });


            return values.some(
                function(value) {

                    return (
                        value === projectLocation ||
                        value === "europe" ||
                        value === "eu" ||
                        value.includes("europe")
                    );
                }
            );
        });


    if (exact) {
        return exact;
    }


    return regions.find(
        function(region) {

            const text =
                safeJson(region)
                    .toLowerCase();

            return (
                text.includes("europe") ||
                text.includes("\"eu\"") ||
                text.includes("app21")
            );
        }
    );
}


// --------------------------------------------------
// WAIT
// --------------------------------------------------

function wait(milliseconds) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );
        }
    );
}


// --------------------------------------------------
// DISPLAY
// --------------------------------------------------

function showStep(message) {

    document
        .getElementById("result")
        .textContent =
        message;
}


// --------------------------------------------------
// SAFE JSON
// --------------------------------------------------

function safeJson(value) {

    try {

        return JSON.stringify(
            value,

            function(key, item) {

                if (
                    typeof item === "bigint"
                ) {
                    return item.toString();
                }

                return item;
            },

            2
        );

    } catch (error) {

        return String(value);
    }
}


// --------------------------------------------------
// ERROR DISPLAY
// --------------------------------------------------

function showFailure(
    title,
    error
) {

    console.error(error);

    document
        .getElementById("result")
        .textContent =

        title +
        "\n" +
        "================================\n\n" +

        (
            error &&
            error.message
                ? error.message
                : String(error)
        );
}


// --------------------------------------------------
// BUTTON
// --------------------------------------------------

document
    .getElementById("writeButton")
    .addEventListener(
        "click",
        writeSharedStatus
    );


// --------------------------------------------------
// GLOBAL JS ERROR
// --------------------------------------------------

window.addEventListener(
    "error",

    function(event) {

        showFailure(
            "JavaScript error",
            event.error ||
            event.message
        );
    }
);


// --------------------------------------------------
// GO
// --------------------------------------------------

window.addEventListener(
    "load",
    start
);

</script>

</body>

</html>
