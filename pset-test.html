<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shared Weld Status Write Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 16px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #888888;
            cursor: wait;
        }

        pre {
            margin-top: 15px;
            padding: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            max-height: 520px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Shared Weld Status Write</h2>

    <p>
        Write Part Completed into the real Weld Progress
        Property Set stored in Trimble.
    </p>

    <button id="writeButton">
        WRITE PART COMPLETED
    </button>

    <pre id="result">Waiting...</pre>

</div>


<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>

<script>

let API = null;


// --------------------------------------------------
// REAL TRIMBLE RESOURCE IDENTIFIERS
// --------------------------------------------------

// Weld Status Tracking library
const LIBRARY_ID =
    "7r7dk7c43t1shjqgmj5urdjbyrtsssh0";

// Weld Progress definition
const DEFINITION_ID =
    "uvq7wy0xgyb2o2sxornh5juwyngsn76w";

// Internal property key for Weld Status
const WELD_STATUS_PROPERTY_ID =
    "prop_k57dohz4v8wj0sploxwvjt8jhn7jn605";

// Test weld GUID
const WELD_GUID =
    "f83962c4-3acc-4606-9a48-f17d3a4a2998";

// Shared PSet link controlled by our tracker
const WELD_LINK =
    "frn:entity:" + WELD_GUID;


// --------------------------------------------------
// START
// --------------------------------------------------

async function start() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Connecting to Trimble Connect...";

        API =
            await TrimbleConnectWorkspace.connect(
                window.parent
            );

        const project =
            await API.project.getProject();

        result.textContent =
            "Connected to Trimble Connect.\n\n" +

            "Project:\n" +
            (
                project?.name ||
                project?.id ||
                "Not returned"
            ) +

            "\n\nReady to perform the real shared write.";

    } catch (error) {

        showFailure(
            "Connection failed",
            error
        );
    }
}


// --------------------------------------------------
// WRITE SHARED STATUS
// --------------------------------------------------

async function writeSharedStatus() {

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("writeButton");

    button.disabled = true;

    try {

        // ------------------------------------------
        // PROJECT
        // ------------------------------------------

        showStep(
            "Getting project information..."
        );

        const project =
            await API.project.getProject();

        const projectLocation =
            String(
                project.location || ""
            ).toLowerCase();


        // ------------------------------------------
        // TOKEN
        // ------------------------------------------

        showStep(
            "Getting Trimble access token..."
        );

        const token =
            await API.extension.requestPermission(
                "accesstoken"
            );

        if (!token) {

            throw new Error(
                "Trimble Connect did not return an access token."
            );
        }


        // ------------------------------------------
        // REGIONS
        // ------------------------------------------

        showStep(
            "Finding the regional Property Set service..."
        );

        const regionsResponse =
            await fetch(
                "https://app.connect.trimble.com/tc/api/2.0/regions",
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        if (!regionsResponse.ok) {

            throw new Error(
                "Regions API returned HTTP " +
                regionsResponse.status
            );
        }

        const regions =
            await regionsResponse.json();

        const europeRegion =
            findEuropeRegion(
                regions,
                projectLocation
            );

        if (!europeRegion) {

            throw new Error(
                "Could not identify the Europe region."
            );
        }


        // ------------------------------------------
        // PROPERTY SET API
        // ------------------------------------------

        const psetApi =
            europeRegion["pset-api"] ||
            europeRegion.psetApi ||
            europeRegion.services?.["pset-api"] ||
            europeRegion.services?.psetApi;

        if (!psetApi) {

            throw new Error(
                "The Europe region did not return a Property Set API URL."
            );
        }

        const baseUrl =
            String(psetApi).endsWith("/")
                ? String(psetApi)
                : String(psetApi) + "/";


        // ------------------------------------------
        // REAL PSET URL
        // ------------------------------------------

        const psetUrl =
            baseUrl +
            "psets/" +
            encodeURIComponent(WELD_LINK) +
            "/" +
            encodeURIComponent(LIBRARY_ID) +
            "/" +
            encodeURIComponent(DEFINITION_ID);


        result.textContent =
            "WRITING SHARED STATUS\n" +
            "================================\n\n" +

            "Library:\n" +
            LIBRARY_ID +
            "\n\n" +

            "Definition:\n" +
            DEFINITION_ID +
            "\n\n" +

            "Weld link:\n" +
            WELD_LINK +
            "\n\n" +

            "New value:\n" +
            "Part Completed\n\n" +

            "Sending PATCH request...";


        // ------------------------------------------
        // WRITE PART COMPLETED
        // ------------------------------------------

        const writeBody = {
            props: {
                "Part Completed"
            }
        };

        const writeResponse =
            await fetch(
                psetUrl,
                {
                    method: "PATCH",

                    headers: {
                        "Accept":
                            "application/json",

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify(
                            writeBody
                        )
                }
            );

        const writeText =
            await writeResponse.text();

        let writeData;

        try {

            writeData =
                writeText
                    ? JSON.parse(writeText)
                    : {};

        } catch {

            writeData =
                writeText;
        }

        if (!writeResponse.ok) {

            throw new Error(
                "Shared write returned HTTP " +
                writeResponse.status +
                "\n\n" +
                safeJson(writeData)
            );
        }


        // ------------------------------------------
        // WAIT FOR CLOUD STORAGE
        // ------------------------------------------

        showStep(
            "Write accepted.\n\n" +
            "Waiting for Trimble cloud synchronisation..."
        );

        await wait(
            1500
        );


        // ------------------------------------------
        // READ SAME PSET BACK
        // ------------------------------------------

        const readResponse =
            await fetch(
                psetUrl,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const readText =
            await readResponse.text();

        let readData;

        try {

            readData =
                readText
                    ? JSON.parse(readText)
                    : {};

        } catch {

            readData =
                readText;
        }

        if (!readResponse.ok) {

            throw new Error(
                "Write succeeded, but read-back returned HTTP " +
                readResponse.status +
                "\n\n" +
                safeJson(readData)
            );
        }


        // ------------------------------------------
        // SUCCESS
        // ------------------------------------------

        result.textContent =
            "SHARED WRITE SUCCESSFUL\n" +
            "================================\n\n" +

            "Project:\n" +
            (
                project.name ||
                project.id
            ) +
            "\n\n" +

            "Library:\n" +
            "Weld Status Tracking\n" +
            LIBRARY_ID +
            "\n\n" +

            "Definition:\n" +
            "Weld Progress\n" +
            DEFINITION_ID +
            "\n\n" +

            "Weld link:\n" +
            WELD_LINK +
            "\n\n" +

            "Written status:\n" +
            "Part Completed\n\n" +

            "PATCH HTTP status:\n" +
            writeResponse.status +
            "\n\n" +

            "GET HTTP status:\n" +
            readResponse.status +
            "\n\n" +

            "CLOUD DATA RETURNED\n" +
            "--------------------\n" +
            safeJson(readData);

    } catch (error) {

        showFailure(
            "Shared weld status write failed",
            error
        );

    } finally {

        button.disabled =
            false;
    }
}


// --------------------------------------------------
// FIND EUROPE REGION
// --------------------------------------------------

function findEuropeRegion(
    regions,
    projectLocation
) {

    if (!Array.isArray(regions)) {
        return null;
    }

    const exact =
        regions.find(region => {

            const values =
                [
                    region.location,
                    region.name,
                    region.trmRegion,
                    region.region,
                    region.awsRegion
                ]
                .filter(Boolean)
                .map(value =>
                    String(value)
                        .toLowerCase()
                );

            return values.some(value =>
                value === projectLocation ||
                value === "europe" ||
                value === "eu" ||
                value.includes("europe")
            );
        });

    if (exact) {
        return exact;
    }

    return regions.find(region => {

        const text =
            safeJson(region)
                .toLowerCase();

        return (
            text.includes("europe") ||
            text.includes("\"eu\"") ||
            text.includes("app21")
        );
    });
}


// --------------------------------------------------
// WAIT
// --------------------------------------------------

function wait(milliseconds) {

    return new Promise(resolve => {

        setTimeout(
            resolve,
            milliseconds
        );
    });
}


// --------------------------------------------------
// DISPLAY STEP
// --------------------------------------------------

function showStep(message) {

    document
        .getElementById("result")
        .textContent =
        message;
}


// --------------------------------------------------
// SAFE JSON
// --------------------------------------------------

function safeJson(value) {

    try {

        return JSON.stringify(
            value,
            (key, item) =>
                typeof item === "bigint"
                    ? item.toString()
                    : item,
            2
        );

    } catch {

        return String(value);
    }
}


// --------------------------------------------------
// ERROR
// --------------------------------------------------

function showFailure(
    title,
    error
) {

    console.error(error);

    document
        .getElementById("result")
        .textContent =

        title +
        "\n" +
        "================================\n\n" +

        (
            error?.message ||
            String(error)
        );
}


// --------------------------------------------------
// BUTTON
// --------------------------------------------------

document
    .getElementById("writeButton")
    .addEventListener(
        "click",
        writeSharedStatus
    );


// --------------------------------------------------
// GO
// --------------------------------------------------

window.addEventListener(
    "load",
    start
);

</script>

</body>

</html>
