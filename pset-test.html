<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trimble Property Set Library Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 16px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            margin-top: 15px;
            padding: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Property Set Library Test</h2>

    <p>
        Discover the Europe Property Set Service and retrieve
        the available Property Set libraries.
    </p>

    <button id="testButton">
        FIND PROPERTY SET LIBRARIES
    </button>

    <pre id="result">Waiting...</pre>

</div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>

<script>

let API = null;

async function start() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Connecting to Trimble Connect...";

        API =
            await TrimbleConnectWorkspace.connect(
                window.parent
            );

        result.textContent =
            "Connected.\n\n" +
            "Click FIND PROPERTY SET LIBRARIES.";

    } catch (error) {

        showFailure(
            "Connection failed",
            error
        );
    }
}


async function runTest() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Getting current project...";


        const project =
            await API.project.getProject();


        const projectId =
            project.id;


        const projectLocation =
            String(
                project.location || ""
            ).toLowerCase();


        result.textContent =
            "Project received.\n\n" +
            "Requesting access permission...";


        const token =
            await API.extension.requestPermission(
                "accesstoken"
            );


        if (!token) {

            throw new Error(
                "No access token was returned."
            );
        }


        result.textContent =
            "Project received.\n" +
            "Access permission received.\n\n" +
            "Discovering regional services...";


        const regionsResponse = await fetch(
                "https://app.connect.trimble.com/tc/api/2.0/regions",
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!regionsResponse.ok) {

            throw new Error(
                "Regions API returned HTTP " +
                regionsResponse.status
            );
        }


        const regions =
            await regionsResponse.json();


        const europeRegion =
            findEuropeRegion(
                regions,
                projectLocation
            );


        if (!europeRegion) {

            throw new Error(
                "Could not find the Europe region."
            );
        }


        const psetApi =
            europeRegion["pset-api"] ||
            europeRegion.psetApi ||
            europeRegion.services?.["pset-api"] ||
            europeRegion.services?.psetApi;


        if (!psetApi) {

            result.textContent =
                "PROJECT\n" +
                "--------------------\n" +
                safeJson(project) +
                "\n\n" +

                "EUROPE REGION FOUND\n" +
                "--------------------\n" +
                safeJson(europeRegion) +
                "\n\n" +

                "ERROR\n" +
                "--------------------\n" +
                "No pset-api field was found.";

            return;
        }


        const baseUrl =
            String(psetApi).endsWith("/")
                ? String(psetApi)
                : String(psetApi) + "/";


        const librariesUrl =
            baseUrl + "libs";


        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            "ID: " + projectId + "\n" +
            "Location: " + projectLocation + "\n\n" +

            "EUROPE PROPERTY SET API\n" +
            "--------------------\n" +
            baseUrl +
            "\n\n" +

            "Loading libraries...";


        const librariesResponse =
            await fetch(
                librariesUrl,
                {
                    method: "GET",

                    headers: {
    "Accept": "application/json",
    "Authorization": "Bearer " + token
}
                }
            );


        const librariesText =
            await librariesResponse.text();


        let librariesData;


        try {

            librariesData =
                JSON.parse(
                    librariesText
                );

        } catch {

            librariesData =
                librariesText;
        }


        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            "ID: " + projectId + "\n" +
            "Location: " + projectLocation + "\n\n" +

            "EUROPE PROPERTY SET API\n" +
            "--------------------\n" +
            baseUrl +
            "\n\n" +

            "LIBRARY REQUEST\n" +
            "--------------------\n" +
            librariesUrl +
            "\n\n" +

            "HTTP STATUS\n" +
            "--------------------\n" +
            librariesResponse.status +
            "\n\n" +

            "RESPONSE\n" +
            "--------------------\n" +
            safeJson(
                librariesData
            );


    } catch (error) {

        showFailure(
            "Property Set library test failed",
            error
        );
    }
}


function findEuropeRegion(
    regions,
    projectLocation
) {

    if (!Array.isArray(regions)) {
        return null;
    }


    const exact =
        regions.find(region => {

            const values =
                [
                    region.location,
                    region.name,
                    region.trmRegion,
                    region.region,
                    region.awsRegion
                ]
                .filter(Boolean)
                .map(value =>
                    String(value)
                        .toLowerCase()
                );


            return values.some(value =>
                value === projectLocation ||
                value === "europe" ||
                value === "eu" ||
                value.includes("europe")
            );
        });


    if (exact) {
        return exact;
    }


    return regions.find(region => {

        const text =
            safeJson(region)
                .toLowerCase();


        return (
            text.includes("europe") ||
            text.includes("\"eu\"") ||
            text.includes("app21")
        );
    });
}


function safeJson(value) {

    try {

        return JSON.stringify(
            value,
            (key, item) =>
                typeof item === "bigint"
                    ? item.toString()
                    : item,
            2
        );

    } catch {

        return String(value);
    }
}


function showFailure(
    title,
    error
) {

    console.error(error);


    document
        .getElementById("result")
        .textContent =

        title +
        "\n" +
        "--------------------\n\n" +

        (
            error &&
            error.message
                ? error.message
                : String(error)
        );
}


document
    .getElementById("testButton")
    .addEventListener(
        "click",
        runTest
    );


window.addEventListener(
    "load",
    start
);

</script>

</body>

</html>
