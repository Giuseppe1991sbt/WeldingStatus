<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trimble Region Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 16px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #0063a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            margin-top: 15px;
            padding: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Trimble Region Test</h2>

    <p>
        Find project information and available
        Trimble regional services.
    </p>

    <button id="testButton">
        RUN REGION TEST
    </button>

    <pre id="result">Waiting...</pre>

</div>


<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>


<script>

let API = null;


async function start() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Connecting to Trimble Connect...";

        API =
            await TrimbleConnectWorkspace.connect(
                window.parent
            );

        result.textContent =
            "Connected to Trimble Connect.\n\n" +
            "Click RUN REGION TEST.";

    } catch (error) {

        result.textContent =
            "Connection failed:\n\n" +
            error.message;
    }
}


async function runTest() {

    const result =
        document.getElementById("result");

    try {

        result.textContent =
            "Getting current Trimble project...";


        const project =
            await API.project.getProject();


        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            safeJson(project) +
            "\n\n" +
            "Requesting access token...";


        const token =
            await API.extension.requestPermission(
                "accesstoken"
            );


        if (!token) {

            throw new Error(
                "Trimble did not return an access token."
            );
        }


        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            safeJson(project) +
            "\n\n" +
            "Access token: RECEIVED\n\n" +
            "Discovering Trimble regions...";


        const response =
            await fetch(
                "https://app.connect.trimble.com/tc/api/2.0/regions",
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            data =
                text;
        }


        result.textContent =
            "PROJECT\n" +
            "--------------------\n" +
            safeJson(project) +
            "\n\n" +

            "ACCESS TOKEN\n" +
            "--------------------\n" +
            "RECEIVED\n\n" +

            "REGIONS API\n" +
            "--------------------\n" +
            "HTTP status: " +
            response.status +
            "\n\n" +

            safeJson(data);


    } catch (error) {

        console.error(error);

        result.textContent =
            "TEST FAILED\n" +
            "--------------------\n\n" +
            (
                error &&
                error.message
                    ? error.message
                    : String(error)
            );
    }
}


function safeJson(value) {

    try {

        return JSON.stringify(
            value,
            (key, item) =>
                typeof item === "bigint"
                    ? item.toString()
                    : item,
            2
        );

    } catch {

        return String(value);
    }
}


document
    .getElementById("testButton")
    .addEventListener(
        "click",
        runTest
    );


window.addEventListener(
    "load",
    start
);

</script>

</body>

</html>
