<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weld Status Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
        }

        #status {
            padding: 10px;
            background: #eee;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="panel">

    <h2>Weld Status Tracker</h2>

    <p>
        Select a weld in the Trimble Connect 3D model.
    </p>

    <div id="status">
        Waiting for Trimble Connect...
    </div>

</div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="app.js?v=4"></script>

</body>
</html>
